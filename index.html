<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>分隊工具</title>
<style>
:root{--bg:#f4f5f7;--s1:#fff;--s2:#eef0f3;--t1:#15171a;--t2:#5b616b;--bd:#d8dce2;--ac:#2a5bd7;--acb:#e6edff;--wn:#8a5a00;--wnb:#fff3d6;--ok:#17703d;--okb:#e0f5e8;--dg:#b3261e;--dgb:#fde8e6;--pu:#6a3fb5;--pub:#efe7fb}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--s1:#1d2025;--s2:#272b32;--t1:#eceef1;--t2:#a0a7b2;--bd:#363b44;--ac:#7ea2ff;--acb:#22304f;--wn:#f0c36a;--wnb:#3b2f12;--ok:#7fd9a2;--okb:#17301f;--dg:#ff9b93;--dgb:#3d1c19;--pu:#c3a4ff;--pub:#2c2140}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t1);font:15px/1.55 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:80px}
#top{position:sticky;top:0;z-index:20;background:var(--s1);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:6px 12px;flex-wrap:wrap}
#top>b{font-size:16px}
#nav{display:flex;gap:2px;overflow-x:auto;flex:1}
#nav button{border:0;background:transparent;color:var(--t2);padding:10px 12px;min-height:44px;white-space:nowrap;cursor:pointer;font:inherit;border-bottom:3px solid transparent}
#nav button.on{color:var(--ac);font-weight:600;border-bottom-color:var(--ac)}
@media(max-width:759px){#nav{position:fixed;left:0;right:0;bottom:0;background:var(--s1);border-top:1px solid var(--bd);z-index:30;padding-bottom:env(safe-area-inset-bottom)}#nav button{border-bottom:0;border-top:3px solid transparent;flex:1;min-width:62px;padding:8px 6px;font-size:13px}#nav button.on{border-top-color:var(--ac)}.tcol{display:none}.tcol.sel{display:block}}
@media(min-width:760px){.mtabs{display:none}}
main{max-width:1400px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:12px}
.card.wn{background:var(--wnb);border-color:var(--wn)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sp{justify-content:space-between}
.sub{color:var(--t2);font-size:13px}
button,select,input,textarea{font:inherit;color:var(--t1)}
.btn{min-height:44px;padding:8px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--s1);cursor:pointer}
.btn.pri{background:var(--acb);color:var(--ac);border-color:var(--ac);font-weight:600}
.btn.sm{min-height:38px;padding:4px 10px;font-size:13px}
.btn.on{background:var(--acb);color:var(--ac);border-color:var(--ac);font-weight:600}
.btn:disabled{opacity:.45}
input,select,textarea{min-height:44px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--s1);font-size:16px;max-width:100%}

.bd.w{background:var(--wnb);color:var(--wn)}.bd.o{background:var(--okb);color:var(--ok)}.bd.a{background:var(--acb);color:var(--ac)}.bd.p{background:var(--pub);color:var(--pu)}.bd.d{background:var(--dgb);color:var(--dg)}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.mt{background:var(--s2);border-radius:10px;padding:10px 12px}.mt .v{font-size:24px;font-weight:600}
.mc{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;cursor:pointer;min-height:48px;background:var(--s1)}
.mc.wr{border-color:var(--wn)}.mc .n{font-weight:600;white-space:nowrap}.mc .bs{flex:1;display:flex;flex-wrap:wrap;gap:3px}.mc .pw{font-size:13px;color:var(--t2);white-space:nowrap}.mc .rk{width:20px;font-size:12px;color:var(--t2)}
.chip{display:inline-block;font-size:13px;padding:5px 10px;border-radius:8px;background:var(--s2);margin:2px 4px 2px 0;cursor:pointer}
.pb{height:8px;border-radius:4px;background:var(--s2);position:relative}.pb i{display:block;height:100%;border-radius:4px;background:var(--ac)}.pb i.lo{background:var(--wn)}.pb b{position:absolute;top:-3px;bottom:-3px;left:50%;border-left:1px solid var(--t2)}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.st div{background:var(--s2);border-radius:8px;padding:6px 8px}.st span{display:block;font-size:12px;color:var(--t2)}

.hb{display:flex;align-items:center;gap:6px;margin:5px 0}.hb .l{width:96px;font-size:12px;color:var(--t2);flex:none}.hb .tr{flex:1;height:10px;background:var(--s2);border-radius:3px;position:relative}.hb .tr i{display:block;height:100%;background:var(--ac);opacity:.8;border-radius:3px}.hb .tr b{position:absolute;top:-2px;bottom:-2px;border-left:2px solid var(--t1)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none}
#sh{position:fixed;z-index:51;background:var(--s1);border:1px solid var(--bd);padding:14px;display:none;overflow:auto}
@media(max-width:759px){#sh{left:0;right:0;bottom:0;max-height:82vh;border-radius:16px 16px 0 0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}}
@media(min-width:760px){#sh{top:0;right:0;bottom:0;width:360px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:70px;z-index:60;background:var(--t1);color:var(--s1);padding:10px 16px;border-radius:10px;display:none;max-width:90vw}
h3{margin:0 0 6px;font-size:16px}
</style></head>
<body><div id="top"></div><main id="main"><div class="card">載入中…</div></main><div id="ov"></div><div id="sh"></div><div id="toast"></div><datalist id="plist"></datalist>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SELF=new URLSearchParams(location.search).get('v')==='self';
let S=null;
const UI={scr:'overview',team:null,sort:'power',all:false,sheet:null,chart:0,zone:{},prev:null,imp:null,att:'all',selfQ:'',selfRes:null,report:false,mt:null,err:'',saved:'',undo:[],mp:null,csv:'',url:'',bk:''};
const NAV=[['overview','總覽'],['import','匯入'],['board','分隊板'],['fix','修正'],['mission','任務'],['att','點名'],['rules','規則'],['self','盟友'],['backup','備份']];
const DEF=()=>({seq:1,players:{},alias:{},draft:{},autoLinks:[],rules:{together:[],locks:{},alts:[],exc:{}},pend:[],snaps:[],events:[],pub:null,req:[],
 ev:{id:'e'+Date.now(),name:'兵工廠',type:'foundry',lt:{1:'22',2:'20'},min:15,max:30,K:5,mode:'m',pri:'jQt',
  teams:[{id:'j1',lg:1,al:'jQt',on:true},{id:'a1',lg:1,al:'aQt',on:true},{id:'j2',lg:2,al:'jQt',on:true},{id:'a2',lg:2,al:'aQt',on:true}],final:null,att:{},attDone:false,mo:{}}});
const Store={async load(){try{if(window.storage){const r=await window.storage.get('roster-state');if(r&&r.value)return JSON.parse(r.value)}}catch(e){}return null},
 async save(j){try{if(window.storage){await window.storage.set('roster-state',j);return true}}catch(e){}return false}};
let svT=null;function save(){clearTimeout(svT);UI.saved='儲存中…';stat();svT=setTimeout(async()=>{const ok=await Store.save(JSON.stringify(S));UI.saved=ok?'已儲存':'此環境無法儲存，請用備份';stat()},400)}
function stat(){const e=$('#stat');if(e)e.textContent=UI.saved}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',3200)}
function mut(fn,msg){UI.undo.push(JSON.stringify(S));if(UI.undo.length>10)UI.undo.shift();fn();norm();save();if(msg)toast(msg);render()}
function undo(){const j=UI.undo.pop();if(!j)return toast('沒有可復原的步驟');S=JSON.parse(j);save();render();toast('已復原')}
const E=()=>S.ev,eff=p=>p.man||p.intent||'none',tOn=()=>E().teams.filter(t=>t.on),tById=id=>E().teams.find(t=>t.id===id);
const tLabel=t=>t.al+' 軍團'+(t.lg===1?'一':'二'),tTime=t=>E().lt[t.lg]==='22'?'晚上 10 點':'晚上 8 點';
const f1=x=>(Math.round(x*10)/10).toFixed(1),f2=x=>(Math.round(x*100)/100).toFixed(2),fmt=x=>x>0?f1(x/1e8)+' 億':'戰力不明';
const sc=s=>String(s==null?'':s).replace(/[\u200B-\u200D\uFEFF\u00A0]/g,'').trim();
const SC={'乐':'樂','鸭':'鴨','关':'關','国':'國','门':'門','线':'線','马':'馬','龙':'龍','风':'風','云':'雲','爱':'愛','电':'電','时':'時','杀':'殺','际':'際','师':'師','团':'團','战':'戰','钱':'錢','宝':'寶','兰':'蘭','罗':'羅','们':'們','这':'這','说':'說','学':'學','红':'紅','点':'點','头':'頭','军':'軍','妈':'媽','热':'熱','对':'對','来':'來','会':'會','万':'萬','东':'東','长':'長'};
function nz(s){return String(s||'').normalize('NFKC').replace(/[\u200B-\u200D\uFEFF\uFE0F\u00A0]/g,'').replace(/[\u4e00-\u9fff]/g,c=>SC[c]||c).toLowerCase().replace(/[^\p{L}\p{N}]/gu,'')}
function sim(a,b){if(!a||!b)return 0;if(a===b)return 1;if(a.length<2||b.length<2)return 0;const g=s=>{const m={};for(let i=0;i<s.length-1;i++){const k=s.substr(i,2);m[k]=(m[k]||0)+1}return m};const x=g(a),y=g(b);let n=0;for(const k in x)if(y[k])n+=Math.min(x[k],y[k]);let r=2*n/(a.length+b.length-2);const sh=a.length<b.length?a:b,lo=a.length<b.length?b:a;if(sh.length>=3&&lo.includes(sh))r=Math.max(r,.8);return r}
const AB=['不克','無法','請假','不參加','未參加','沒空','不來','不參戰'];
function pInt(s){s=sc(s);if(!s)return'none';if(AB.some(k=>s.includes(k)))return'out';const a=/軍團一|一團|22/.test(s),b=/軍團二|二團|20/.test(s);if(a&&b)return'none';if(a)return'1';if(b)return'2';return'none'}
function csv(t){t=String(t||'').replace(/^\uFEFF/,'');const d=((t.split(/\r?\n/)[0]||'').match(/\t/g)||[]).length>=2?'\t':',';const R=[];let r=[],v='',q=false;for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];if(c==='"'){if(q&&n==='"'){v+='"';i++}else q=!q}else if(c===d&&!q){r.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;r.push(v);if(r.length>1||r[0]!=='')R.push(r);r=[];v=''}else v+=c}if(v||r.length){r.push(v);R.push(r)}return R}
function detect(h){const H=h.map(sc);const pick=(ex,ks,bad)=>{let i=H.findIndex(x=>ex.includes(x));if(i<0)i=H.findIndex(x=>!(bad||[]).some(b=>x.includes(b))&&ks.some(k=>x.toLowerCase().includes(k)));return i};return{name:pick(['玩家名稱'],['名稱','name','暱稱','玩家','成員']),intent:pick(['參戰意願'],['意願','選項','option','報名']),al:pick(['聯盟'],['聯盟','alliance']),power:pick(['實力'],['實力','戰力','power'],['標準化','部隊'])}}
function rowsOf(T,m){const seen={},out=[];for(let i=1;i<T.length;i++){const r=T[i],name=sc(r[m.name]);if(!name)continue;const k=nz(name);if(!k||seen[k])continue;seen[k]=1;out.push({name,intent:m.intent>=0?pInt(r[m.intent]):'none',al:m.al>=0?(/aqt/i.test(r[m.al])?'aQt':/jqt/i.test(r[m.al])?'jQt':''):'',power:m.power>=0?(parseFloat(sc(r[m.power]).replace(/[,，]/g,''))||0):0})}return out}
async function fetchSheet(u){const m=u.match(/spreadsheets\/d\/(?:e\/)?([^/?#]+)/),pub=/spreadsheets\/d\/e\//.test(u),g=(u.match(/gid=(\d+)/)||[])[1],gs=g?'&gid='+g:'';let d;if(m&&pub)d=[u.replace(/\/pub(html)?.*/,'/pub?output=csv')+gs];else if(m)d=['https://docs.google.com/spreadsheets/d/'+m[1]+'/gviz/tq?tqx=out:csv'+gs,'https://docs.google.com/spreadsheets/d/'+m[1]+'/export?format=csv'+gs];else d=[u];
 const c=[...d];d.forEach(x=>{c.push('https://api.allorigins.win/raw?url='+encodeURIComponent(x));c.push('https://corsproxy.io/?'+encodeURIComponent(x))});
 const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),15000);
 const one=async x=>{const r=await fetch(x,{signal:ctl.signal,cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text(),h=t.trim().slice(0,100).toLowerCase();if(t.length<10||h.startsWith('<')||h.startsWith('{'))throw new Error('不是 CSV');return t};
 try{const t=await Promise.any(c.map(one));ctl.abort();return t}finally{clearTimeout(to)}}

function place(p){if(p.wait)return null;const on=id=>{const t=tById(id);return t&&t.on};if(p.fixed&&on(p.fixed))return{t:p.fixed,why:'固定'};const d=S.draft[p.id],it=eff(p);if(d&&on(d.t)&&(it==='1'||it==='2'))return d;return null}
function view(){const T=tOn(),tm={},where={},R={wait:[],out:[],none:[],nt:[]};T.forEach(t=>tm[t.id]=[]);
 Object.values(S.players).forEach(p=>{if(p.wait){R.wait.push(p);return}const pl=place(p);if(pl){tm[pl.t].push(p);where[p.id]=pl;return}const it=eff(p);if(it==='out')R.out.push(p);else if(it==='1'||it==='2')R.nt.push(p);else R.none.push(p)});
 Object.values(tm).forEach(a=>a.sort((x,y)=>y.power-x.power));['wait','out','none','nt'].forEach(k=>R[k].sort((x,y)=>y.power-x.power));return Object.assign({tm,where},R)}
function stats(a){const n=a.length,pw=a.map(p=>p.power).sort((x,y)=>y-x),tot=pw.reduce((s,x)=>s+x,0),avg=n?tot/n:0,k=Math.max(1,Math.min(E().K,Math.floor(n/3))),kk=Math.min(k,n),head=kk?pw.slice(0,kk).reduce((s,x)=>s+x,0)/kk:0;return{n,tot,avg,head,k,r:avg?head/avg:0}}
function dealLegion(TL,pool,pre,mode){const out={},arr=[...pool].sort((a,b)=>b.power-a.power),cnt={},sum={},hs={},hc={};
 TL.forEach(t=>{const pr=(pre&&pre[t.id])||[];cnt[t.id]=pr.length;sum[t.id]=pr.reduce((s,p)=>s+p.power,0);hs[t.id]=0;hc[t.id]=0});
 const put=(p,t,w)=>{out[p.id]={t,why:w};cnt[t]++;sum[t]+=p.power};
 const by=asc=>[...TL].sort((a,b)=>cnt[a.id]-cnt[b.id]||(asc?sum[a.id]-sum[b.id]:sum[b.id]-sum[a.id]))[0].id;
 if(TL.length===1){arr.forEach(p=>put(p,TL[0].id,'依投票'));return out}
 const n=arr.length+TL.reduce((s,t)=>s+cnt[t.id],0);
 if(mode==='s'){arr.forEach(p=>put(p,by(true),'S 型'))}
 else if(mode==='step'){const ord=[...TL].sort((a,b)=>(a.al===E().pri?0:1)-(b.al===E().pri?0:1)),k=ord.length,per=Math.min(E().min,Math.floor(n/k)),tg={};ord.forEach(t=>tg[t.id]=per);tg[ord[0].id]=Math.min(E().max,n-per*(k-1));let used=ord.reduce((s,t)=>s+tg[t.id],0),i=1;while(used<n){tg[ord[(i%k)||1].id]++;used++;i++}
  arr.forEach(p=>{const t=ord.find(x=>cnt[x.id]<tg[x.id])||ord[k-1];put(p,t.id,'階梯')})}
 else{const kk=Math.max(1,Math.min(E().K,Math.floor(n/TL.length/3))),head=arr.splice(0,kk*TL.length);
  head.forEach(p=>{const t=[...TL].sort((a,b)=>hc[a.id]-hc[b.id]||hs[a.id]-hs[b.id])[0].id;hc[t]++;hs[t]+=p.power;put(p,t,'M 型・頭部')});
  let fr=true;while(arr.length){const p=fr?arr.shift():arr.pop();put(p,by(fr),'M 型');fr=!fr}}
 return out}
function genDraft(mode){const d={},T=tOn(),elig=Object.values(S.players).filter(p=>!p.wait&&(eff(p)==='1'||eff(p)==='2')),isFx=p=>{const t=p.fixed&&tById(p.fixed);return t&&t.on},pre={};
 T.forEach(t=>pre[t.id]=[]);elig.forEach(p=>{if(isFx(p))pre[p.fixed].push(p)});
 [1,2].forEach(L=>{const TL=T.filter(t=>t.lg===L);if(!TL.length)return;let pool=elig.filter(p=>!isFx(p)&&eff(p)===String(L));
  const tg=S.rules.together.map(id=>S.players[id]).filter(p=>p&&pool.includes(p));
  if(tg.length){const t=[...TL].sort((a,b)=>pre[a.id].length-pre[b.id].length)[0];tg.forEach(p=>{d[p.id]={t:t.id,why:'同隊群組'};pre[t.id].push(p)});pool=pool.filter(p=>!tg.includes(p))}
  pool.filter(p=>{const lk=S.rules.locks[p.id];return lk&&TL.some(t=>t.id===lk)}).forEach(p=>{const lk=S.rules.locks[p.id];d[p.id]={t:lk,why:'鎖定'};pre[lk].push(p)});
  pool=pool.filter(p=>!d[p.id]);Object.assign(d,dealLegion(TL,pool,pre,mode))});return d}
function norm(){const T=tOn();Object.keys(S.draft).forEach(id=>{if(!S.players[id])delete S.draft[id]});const V=view(),cnt={},sum={};T.forEach(t=>{cnt[t.id]=V.tm[t.id].length;sum[t.id]=V.tm[t.id].reduce((s,p)=>s+p.power,0)});
 Object.values(S.players).forEach(p=>{if(p.wait)return;const it=eff(p);if(it!=='1'&&it!=='2')return;if(place(p))return;const TL=T.filter(t=>String(t.lg)===it);if(!TL.length)return;const to=[...TL].sort((a,b)=>cnt[a.id]-cnt[b.id]||sum[a.id]-sum[b.id])[0].id;S.draft[p.id]={t:to,why:'補位'};cnt[to]++;sum[to]+=p.power})}
function eqRatio(L,V){const TL=tOn().filter(t=>t.lg===L),all=[].concat(...TL.map(t=>V.tm[t.id]));if(TL.length<2||!all.length)return null;const d=dealLegion(TL,all,{},'s'),g={};TL.forEach(t=>g[t.id]=[]);all.forEach(p=>g[d[p.id].t].push(p));return TL.reduce((s,t)=>s+stats(g[t.id]).r,0)/TL.length}
function hist(pid){let g=0,l=0,a=0,r=[];S.events.forEach(ev=>{if(ev.teams&&ev.teams[pid]){g++;const s=ev.att&&ev.att[pid];if(s==='leave')l++;else if(s==='absent')a++;r.push(s==='absent'?'✗':s==='leave'?'◐':'✓')}});return{g,l,a,r:r.slice(-5).join(' ')}}
function hbadge(pid){if(!S.events.length)return'';const h=hist(pid);if(!h.g)return'<span class="bd">新人</span>';if(h.a)return'<span class="bd w">缺 '+h.a+'</span>';if(h.l)return'<span class="bd">假 '+h.l+'</span>';return''}
const mism=(p,V)=>{const pl=V.where[p.id];if(!pl)return false;const it=eff(p),t=tById(pl.t);return !(it==='1'||it==='2')||String(t.lg)!==it};

function matchRows(rows){const idx={};Object.values(S.players).forEach(p=>{idx[nz(p.name)]=p.id;(p.aliases||[]).forEach(a=>{const k=nz(a.n);if(k&&!idx[k])idx[k]=p.id})});Object.keys(S.alias).forEach(k=>{if(S.players[S.alias[k]])idx[k]=S.alias[k]});
 const used={},res={exact:[],auto:[],pend:[],news:[],missing:[]},left=[];

 case'repT':UI.report=!UI.report;render();break;
 case'repSend':{const r=UI.selfRes;if(!r||r.none||!UI.repO)return toast('請先查詢自己的名字，並填入對方名字');S.req.push({me:S.players[r.pid].name,kind:UI.repK||'alt',other:UI.repO,at:Date.now()});save();UI.report=false;UI.repO='';toast('已送出，等幹部確認');render()}break;
 case'annCopy':copy(UI.ann||'','已複製公告');break;
 case'bkGen':UI.bk=JSON.stringify(S);render();break;case'bkCopy':copy(UI.bk||JSON.stringify(S),'已複製備份');break;
 case'bkLoad':try{const o=JSON.parse(UI.bk);if(!o.players||!o.ev)throw 0;UI.undo.push(JSON.stringify(S));S=o;norm();save();render();toast('已還原')}catch(e){toast('備份格式不正確')}break;
 case'bkDown':{const b=new Blob([JSON.stringify(S)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='roster-backup.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}break;
 case'wipe':if(UI.wipe){UI.wipe=false;UI.undo.push(JSON.stringify(S));S=DEF();save();render();toast('已清除')}else{UI.wipe=true;toast('再按一次「清除全部資料」才會執行');setTimeout(()=>UI.wipe=false,4000)}break}}
function chg(c,v,el){switch(c){
 case'file':{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{UI.csv=String(r.result);startImport(UI.csv,'檔案：'+f.name)};r.readAsText(f,'utf-8')}break;
 case'map':UI.imp.map[v]=+el.value;prepImp();render();break;case'ok':UI.imp.ok=el.checked;render();break;
 case'cfg':{const n=+el.value;if(!(n>0))return;mut(()=>{E()[v]=n})}break;case'pri':mut(()=>{E().pri=el.value});break;
 case'evName':mut(()=>{E().name=el.value||'兵工廠'});break;case'evType':mut(()=>{E().type=el.value});break;
 case'repK':UI.repK=el.value;break}}
document.addEventListener('click',e=>{if(e.target.id==='ov'){UI.sheet=null;render();return}const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v,b.dataset.w)});

document.addEventListener('input',e=>{const i=e.target.dataset&&e.target.dataset.i;if(i)UI[i]=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.i==='selfQ')act('selfGo')});
(async()=>{S=await Store.load()||DEF();const d=DEF();Object.keys(d).forEach(k=>{if(S[k]===undefined)S[k]=d[k]});Object.keys(d.ev).forEach(k=>{if(S.ev[k]===undefined)S.ev[k]=d.ev[k]});norm();UI.saved=window.storage?'已儲存':'此環境無法儲存，請用備份';render()})();
